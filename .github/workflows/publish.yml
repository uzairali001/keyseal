# Publishes the keyseal tool to nuget.org with Trusted Publishing.
# The job exchanges a GitHub OIDC token for a one-hour NuGet API key.
# No long-lived API key is stored in this repository.
#
# Register a policy at https://www.nuget.org/account/trustedpublishing :
#   Repository owner: uzairali001
#   Repository: keyseal
#   Workflow file: publish.yml
#   Environment: release
#
# Repository secret NUGET_USER must be the nuget.org profile name, not the email.

name: Publish to NuGet

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test keyseal.slnx -c Release

      - name: Version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/Keyseal/Keyseal.csproj -c Release -o ./artifacts /p:Version=${{ steps.version.outputs.VERSION }}

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
